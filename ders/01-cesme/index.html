<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ders 1 — İlk Çeşme (tek jet, CPU parçacık)</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  #info {
    position: fixed; top: 8px; left: 8px;
    color: #8fd3ff; font: 13px/1.5 Consolas, monospace;
    text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
<div id="info">Ders 1 — tek jet · sol tık: döndür · teker: zoom · <span id="fps">-</span> fps</div>

<!-- importmap: "three" adını CDN'deki gerçek dosyaya eşler.
     Kurulum yok, npm yok — tarayıcı modülü doğrudan internetten çeker. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// BLOK 1 — SAHNE KURULUMU
// three.js'in değişmez üçlüsü: Scene (dünya), Camera (göz),
// Renderer (dünyayı gözün açısından canvas'a çizen makine).
// ============================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050810);          // gece mavisi
scene.fog = new THREE.Fog(0x050810, 15, 45);           // uzak = fona karışır (derinlik hissi bedavaya)

// PerspectiveCamera(görüş açısı°, en-boy oranı, en yakın, en uzak çizim mesafesi)
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7, 4, 9);                          // metre cinsinden düşünüyoruz

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); // 4K ekranda GPU'yu yakmamak için tavan
document.body.appendChild(renderer.domElement);        // renderer.domElement = <canvas>

// OrbitControls: fare ile kamerayı hedef noktası etrafında döndürür. P0'daki "kamera döner" bu.
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.5, 0);                        // jetin ortasına bak
controls.enableDamping = true;                         // bırakınca yumuşak yavaşlama

// Zemin: havuz yüzeyi taklidi — koyu, hafif yansıtıcı daire
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48),
  new THREE.MeshStandardMaterial({ color: 0x0a1622, roughness: 0.3, metalness: 0.2 })
);
ground.rotation.x = -Math.PI / 2;                      // düzlem dik doğar, yere yatırıyoruz
scene.add(ground);

// Işıklar sadece zemin için — parçacıklar (PointsMaterial) ışıktan etkilenmez,
// kendi rengiyle çizilir. RGB ışığın suyu boyaması Ders 2'nin konusu.
scene.add(new THREE.AmbientLight(0x334455, 0.8));
const lamp = new THREE.PointLight(0x5599ff, 60, 30);
lamp.position.set(0, 4, 0);
scene.add(lamp);

// ============================================================
// BLOK 2 — PARÇACIK HAVUZU
// Su jeti = binlerce bağımsız damla. Her damla sadece 2 şey bilir:
// konum (p) ve hız (v). Fizik lise balistiği:
//   her karede  v.y -= 9.81*dt   ve   p += v*dt
// Damla yere düşünce ölmez, nozula ışınlanıp yeniden fışkırır
// (havuz geri dönüşümü — sürekli jet böyle ucuza çıkar).
// ============================================================

const N = 6000;                                        // damla sayısı (CPU için rahat)
const positions = new Float32Array(N * 3);             // GPU'ya gidecek ham dizi [x,y,z, x,y,z, ...]
const velocities = new Float32Array(N * 3);            // sadece CPU'da kalır

const JET_SPEED = 11;                                  // m/s çıkış hızı → tepe ≈ v²/2g ≈ 6.2 m
const SPREAD = 0.045;                                  // koni açıklığı (0 = cetvel gibi, büyük = duş)
const G = 9.81;

// Bir damlayı nozuldan yeniden fırlat: hafif rastgele koni içinde yukarı
function respawn(i) {
  positions[i * 3 + 0] = 0;
  positions[i * 3 + 1] = 0;
  positions[i * 3 + 2] = 0;
  const a = Math.random() * Math.PI * 2;               // koni etrafında rastgele yön
  const r = Math.random() * SPREAD;                    // koni içinde rastgele sapma
  velocities[i * 3 + 0] = Math.sin(a) * r * JET_SPEED;
  velocities[i * 3 + 1] = JET_SPEED * (0.94 + Math.random() * 0.12); // hızda %±6 titreşim
  velocities[i * 3 + 2] = Math.cos(a) * r * JET_SPEED;
}
// İlk doğumda herkes aynı anda fışkırırsa su "yumru" halinde iner kalkar
// (ilk denemede yaşadık!). Çözüm: her damlayı balistiğin KAPALI-FORM çözümüyle
// rastgele bir faza ışınla — sanki t saniye önce fırlamış gibi:
//   p(t) = v0*t - ½gt²   ve   v(t) = v0 - g*t
// Bu formül Ders 3'te GPU'ya taşınmanın da anahtarı (durum tutmadan konum hesabı).
const FLIGHT_TIME = 2 * JET_SPEED / G;                 // çıkış→tepe→havuz ≈ 2.24 sn
function scatter(i) {
  respawn(i);
  const t = Math.random() * FLIGHT_TIME;
  positions[i * 3 + 0] += velocities[i * 3 + 0] * t;
  positions[i * 3 + 1] += velocities[i * 3 + 1] * t - 0.5 * G * t * t;
  positions[i * 3 + 2] += velocities[i * 3 + 2] * t;
  velocities[i * 3 + 1] -= G * t;
}
for (let i = 0; i < N; i++) scatter(i);

// BufferGeometry: "işte sana N nokta, koordinatları bu dizide" demenin three.js dili.
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Su hissinin yarısı malzemede:
//  - AdditiveBlending: üst üste binen damlalar parlar (ışık gibi toplanır)
//  - depthWrite:false: yarı saydamlar birbirini bloke etmesin
const mat = new THREE.PointsMaterial({
  color: 0xbfe3ff,
  size: 0.07,                                          // metre; sizeAttenuation ile uzakta küçülür
  transparent: true,
  opacity: 0.55,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

// Points: N damlanın TAMAMI tek çizim komutunda gider. 6000 Mesh yapsaydık sürünürdü.
const jet = new THREE.Points(geo, mat);
scene.add(jet);

// Fizik adımı: tüm damlaları dt saniye ilerlet
function step(dt) {
  for (let i = 0; i < N; i++) {
    velocities[i * 3 + 1] -= G * dt;                   // yerçekimi
    positions[i * 3 + 0] += velocities[i * 3 + 0] * dt;
    positions[i * 3 + 1] += velocities[i * 3 + 1] * dt;
    positions[i * 3 + 2] += velocities[i * 3 + 2] * dt;
    if (positions[i * 3 + 1] < 0) respawn(i);          // havuza değdi → nozula geri
  }
  geo.attributes.position.needsUpdate = true;          // "dizi değişti, GPU'ya tekrar yolla"
}

// ============================================================
// BLOK 3 — RENDER DÖNGÜSÜ
// Oyun motorlarının kalbi: saniyede ~60 kez
// "zamanı ilerlet → fiziği güncelle → kareyi çiz".
// dt'yi ölçüyoruz ki yavaş makinede su ağır çekime düşmesin.
// ============================================================

const clock = new THREE.Clock();
let frames = 0, fpsTimer = 0;
const fpsEl = document.getElementById('fps');

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20);       // takılmalarda dev dt sıçramasını kırp
  step(dt);
  controls.update();
  renderer.render(scene, camera);

  frames++; fpsTimer += dt;                            // basit fps sayacı
  if (fpsTimer >= 1) { fpsEl.textContent = frames; frames = 0; fpsTimer = 0; }
});

// Pencere boyutu değişince kamera oranını ve canvas'ı güncelle
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Debug kancası: tarayıcı konsolundan canlı sahneyi dürtebilmek için.
// Örn: DERS1.step(1/60); DERS1.renderer.render(DERS1.scene, DERS1.camera)
window.DERS1 = { renderer, scene, camera, geo, positions, velocities, step };
</script>
</body>
</html>
