<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';

// ============================================================
// DERS 10 — VIDEO RENDER: ŞOVU WEBM'E DÖK (P4, son faz)
//
// Ders 1-9 canlı bir çeşme şovu motoru kurdu. Ama satış silahı olması için
// (SCOPE) müşteriye GÖNDERİLEBİLİR bir çıktı gerek: bir video dosyası.
// Bu dersin tezi:
//
//   TARAYICI ZATEN KODEK'E SAHİP. MediaRecorder + canvas.captureStream ile
//   sahneyi (ve müziği) gerçek-zamanlı yakalayıp webm'e yazarız — ffmpeg/
//   sunucu YOK, nakit 0. Markalı overlay için WebGL karesini bir 2D "kayıt
//   tuvaline" kopyalar, üstüne Aquatronic başlığını çizer, ONU kaydederiz.
//
// Yeni parçalar (BLOK 14):
//   • MediaStream birleştirme: video = kayıt tuvali stream'i, ses = actx
//     MediaStreamDestination (buffer kaynağı buraya da bağlı) → tek stream.
//   • MediaRecorder: vp9/opus webm; kare parçaları toplanır, durunca blob
//     → indirilir (kullanıcının kendi tıkıyla; clean-room başlık, ad yok).
//   • Kayıt = şovu t=0'dan bir tur oynat + her kare kompozit + otomatik dur.
//
// preserveDrawingBuffer:true (yukarıda) ŞART. Motor/besteci Ders 9'dan
// birebir. (Not: MediaRecorder'ın webm çıktısı headless'ta doğrulanamaz;
// gerçek tarayıcıda indirilen dosya ile teyit edilir.)
//
// -- aşağısı Ders 9 besteci mimarisi (değişmedi) --
// DERS 9 — MÜZİK → TIMELINE: BESTECİ (eski Seçenek 1)
//
// Ders 7-8'de şovu bir JSON'un sürdüğünü ve o JSON'u elle düzenlediğimizi
// gördük. Bu ders SCOPE'un P3'ü: JSON'u ELLE değil, MÜZİKTEN otomatik
// doğurmak. Projenin doğuş fikri buydu ("besteci"). Dersin tezi:
//
//   BESTECİ = ANALİZ + EŞLEME. Sesi çöz (enerji zarfı, beat, drop), sonra
//   bir DESEN KÜTÜPHANESİYLE (yüksek enerji→jet yükselir, beat→hız nabzı,
//   drop→ışık patlar) Ders 7'nin AYNI timeline formatına anahtar üret.
//   Oynatıcı/motor/editör TEK SATIR değişmez — format sözleşme olduğu için
//   besteci sadece yeni bir "yazar"dır. Ürettiği taslağı editörde (Ders 8)
//   insan düzeltir: otomatik başlangıç + elle rötuş.
//
// Üç parça:
//   • ANALİZ (BLOK 12a): Web Audio ile PCM'i çöz → çerçeve enerjisi (RMS) →
//     yumuşatılmış zarf + akı-tabanlı beat (onset) + drop tespiti. Tamamı
//     düz JS, offline (çalmadan). Kütüphane yok (essentia.js AGPL — SCOPE'ta
//     yasak); ihtiyacımız olan sığ analiz elle ~40 satır.
//   • SENTETİK ÜRETEÇ (BLOK 12b): dosya olmadan da ders çalışsın diye
//     prosedürel bir parça (kick + build + drop) üretir → analiz onu bulur.
//   • TIMELINE ÜRETEÇ (BLOK 12c): analiz → ZAMAN_CIZELGESI kanalları.
//
// Ses = zaman OTORİTESİ: çalarken showT = audio saati → görüntü sese kilitli.
// (Tarayıcı autoplay politikası: AudioContext kullanıcı tıklayana dek askıda;
// o yüzden görüntü iç saatle akar, ses ▶ ile devreye girer.)
//
// Motor + editör Ders 8'den birebir (BLOK 1-11). Yeni: BLOK 12.
// ============================================================

// ============================================================
// BLOK 1 — SAHNE (Ders 8)
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050810);
scene.fog = new THREE.Fog(0x050810, 18, 55);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7, 4, 11);
// preserveDrawingBuffer: BLOK 14'te WebGL canvas'ını 2D kayıt tuvaline
// drawImage ile kopyalayacağız (markalı overlay için). Bu bayrak olmadan
// tampon kare sonunda temizlenir → drawImage boş/siyah gelir.
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.5, 0);
controls.enableDamping = true;
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(10, 48),
  new THREE.MeshStandardMaterial({ color: 0x0a1622, roughness: 0.35, metalness: 0.2 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
scene.add(new THREE.AmbientLight(0x223344, 0.4));
const G = 9.81;

// ============================================================
// BLOK 2 — SPRITE DOKU (Ders 8)
// ============================================================
function dokuUret(ciz) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  ciz(c.getContext('2d'), 128);
  return new THREE.CanvasTexture(c);
}
const damlaDoku = dokuUret((ctx, S) => {
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.75)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
});

// ============================================================
// BLOK 3 — SU CİHAZLARI = VERİ (Ders 8)
// ============================================================
const PRESETLER = {
  duz_jet: { konum: [-2, 0, 0], kenar: 176, shape: { type: 'point', angle: 0.05 },
    particle: { speed: { a: 10.0, b: 12.0 }, life: { a: 2.0, b: 2.3 }, size: 0.045,
      color: '#bfe3ff', alpha: 0.08, aeration: 0.35 }, yumusaklik: 0.4 },
  geyser: { konum: [2, 0, 0], kenar: 196, shape: { type: 'disc', radius: 0.28, angle: 0.22 },
    particle: { speed: { a: 5.5, b: 7.0 }, life: { a: 1.2, b: 1.5 }, size: 0.06,
      color: '#e8f4ff', alpha: 0.03, aeration: 0.75 }, yumusaklik: 0.5 }
};

const N_ISIK = 4;
const ortakUniformlar = {
  uDerinlikDoku: { value: null }, uCozunurluk: { value: new THREE.Vector2() },
  uKameraYakin: { value: camera.near }, uKameraUzak: { value: camera.far },
  uPixelYariCap: { value: 1 }, uIsikSayisi: { value: 0 },
  uIsikPos: { value: Array.from({ length: N_ISIK }, () => new THREE.Vector3()) },
  uIsikYon: { value: Array.from({ length: N_ISIK }, () => new THREE.Vector3(0, 1, 0)) },
  uIsikCosAci: { value: new Array(N_ISIK).fill(1) },
  uIsikRenk: { value: Array.from({ length: N_ISIK }, () => new THREE.Color()) },
  uIsikTepki: { value: 1.6 }, uTabanIsik: { value: 0.30 }
};
function katmanUniformlari(ozel) { return { ...ortakUniformlar, ...ozel }; }

const SOFT_FADE_GLSL = /* glsl */`
  #include <packing>
  uniform sampler2D uDerinlikDoku;
  uniform vec2  uCozunurluk;
  uniform float uKameraYakin;
  uniform float uKameraUzak;
  uniform float uYumusaklik;
  float softFade(float fragViewZ) {
    vec2 uv = gl_FragCoord.xy / uCozunurluk;
    float sahneDerinlik = texture2D(uDerinlikDoku, uv).x;
    float sahneViewZ = perspectiveDepthToViewZ(sahneDerinlik, uKameraYakin, uKameraUzak);
    return smoothstep(0.0, uYumusaklik, fragViewZ - sahneViewZ);
  }
`;

// ============================================================
// BLOK 4 — GPU FİZİK ÇEKİRDEĞİ (Ders 8)
// ============================================================
const GPU_ORTAK_GLSL = /* glsl */`
  float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
  float g_seed;
  float rnd(){ g_seed += 1.0; return hash11(g_seed); }
  void cerceve(vec3 n, out vec3 t1, out vec3 t2){
    vec3 up = abs(n.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
    t1 = normalize(cross(up, n));
    t2 = cross(n, t1);
  }
  vec3 koniYon(vec3 eksen, float aciMax){
    vec3 t1, t2; cerceve(eksen, t1, t2);
    float az = rnd() * 6.2831853;
    float po = aciMax * sqrt(rnd());
    return normalize(eksen * cos(po) + (t1 * cos(az) + t2 * sin(az)) * sin(po));
  }
`;

const konumShader = /* glsl */`
  uniform float uDt; uniform float uTime;
  uniform vec3 uNozulPos; uniform vec3 uNozulYon; uniform float uDiskR;
  ${GPU_ORTAK_GLSL}
  void main(){
    vec2 uv = gl_FragCoord.xy / resolution.xy;
    vec4 P = texture2D(texturePosition, uv);
    vec4 V = texture2D(textureVelocity, uv);
    vec3 pos = P.xyz;  float yas  = P.w;
    vec3 vel = V.xyz;  float omur = V.w;
    vel.y -= 9.81 * uDt;
    pos += vel * uDt;
    yas += uDt;
    if (yas >= omur || pos.y < 0.0) {
      g_seed = dot(uv, vec2(12.9898, 78.233)) + uTime * 7.0 + 3.7;
      vec3 t1, t2; cerceve(normalize(uNozulYon), t1, t2);
      float az = rnd() * 6.2831853;
      float rr = uDiskR * sqrt(rnd());
      pos = uNozulPos + (t1 * cos(az) + t2 * sin(az)) * rr;
      yas = 0.0;
    }
    gl_FragColor = vec4(pos, yas);
  }
`;

const hizShader = /* glsl */`
  uniform float uDt; uniform float uTime;
  uniform vec3 uNozulYon; uniform float uKoniAci;
  uniform float uHizA; uniform float uHizB; uniform float uOmurA; uniform float uOmurB;
  uniform float uHizScale;
  ${GPU_ORTAK_GLSL}
  void main(){
    vec2 uv = gl_FragCoord.xy / resolution.xy;
    vec4 P = texture2D(texturePosition, uv);
    vec4 V = texture2D(textureVelocity, uv);
    float yas  = P.w;
    vec3 vel = V.xyz;  float omur = V.w;
    vec3 yeniVel = vel;  yeniVel.y -= 9.81 * uDt;
    vec3 yeniPos = P.xyz + yeniVel * uDt;
    float yeniYas = yas + uDt;
    if (yeniYas >= omur || yeniPos.y < 0.0) {
      g_seed = dot(uv, vec2(12.9898, 78.233)) + uTime * 7.0;
      vec3 yon = koniYon(normalize(uNozulYon), uKoniAci);
      float hiz  = (uHizA + rnd() * (uHizB - uHizA)) * uHizScale;
      omur       = uOmurA + rnd() * (uOmurB - uOmurA);
      yeniVel = yon * hiz;
    }
    gl_FragColor = vec4(yeniVel, omur);
  }
`;

const _t1 = new THREE.Vector3(), _t2 = new THREE.Vector3();
function cerceveJS(n, t1, t2) {
  const up = Math.abs(n.y) < 0.99 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  t1.crossVectors(up, n).normalize();
  t2.crossVectors(n, t1);
}
function koniYonJS(eksen, aciMax, hedef) {
  cerceveJS(eksen, _t1, _t2);
  const az = Math.random() * Math.PI * 2;
  const po = aciMax * Math.sqrt(Math.random());
  hedef.copy(eksen).multiplyScalar(Math.cos(po))
    .addScaledVector(_t1, Math.cos(az) * Math.sin(po))
    .addScaledVector(_t2, Math.sin(az) * Math.sin(po));
}

// ============================================================
// BLOK 5 — GpuParcaSistemi (Ders 8)
// ============================================================
const _eksen = new THREE.Vector3(0, 1, 0);
const _v0 = new THREE.Vector3(), _p = new THREE.Vector3(), _v = new THREE.Vector3();

class GpuParcaSistemi {
  constructor(preset) {
    this.preset = preset;
    const W = preset.kenar, H = preset.kenar;
    this.sayi = W * H;
    const p = preset.particle;
    this.baseAlfa = p.alpha;
    const nozul = new THREE.Vector3().fromArray(preset.konum);
    const diskR = preset.shape.type === 'disc' ? preset.shape.radius : 0.0;
    const koniAci = preset.shape.angle;
    this.gpu = new GPUComputationRenderer(W, H, renderer);
    this.gpu.setDataType(THREE.FloatType);
    const dtPos = this.gpu.createTexture();
    const dtVel = this.gpu.createTexture();
    const posD = dtPos.image.data, velD = dtVel.image.data;
    for (let i = 0; i < this.sayi; i++) {
      const hiz = p.speed.a + Math.random() * (p.speed.b - p.speed.a);
      const omur = p.life.a + Math.random() * (p.life.b - p.life.a);
      const t0 = Math.random() * omur;
      koniYonJS(_eksen, koniAci, _v0);
      _v0.multiplyScalar(hiz);
      _p.copy(nozul);
      if (diskR > 0) {
        cerceveJS(_eksen, _t1, _t2);
        const a = Math.random() * Math.PI * 2;
        const r = diskR * Math.sqrt(Math.random());
        _p.addScaledVector(_t1, Math.cos(a) * r).addScaledVector(_t2, Math.sin(a) * r);
      }
      _p.addScaledVector(_v0, t0); _p.y -= 0.5 * G * t0 * t0;
      _v.copy(_v0); _v.y -= G * t0;
      const k = i * 4;
      posD[k] = _p.x; posD[k + 1] = _p.y; posD[k + 2] = _p.z; posD[k + 3] = t0;
      velD[k] = _v.x; velD[k + 1] = _v.y; velD[k + 2] = _v.z; velD[k + 3] = omur;
    }
    this.posVar = this.gpu.addVariable('texturePosition', konumShader, dtPos);
    this.velVar = this.gpu.addVariable('textureVelocity', hizShader, dtVel);
    this.gpu.setVariableDependencies(this.posVar, [this.posVar, this.velVar]);
    this.gpu.setVariableDependencies(this.velVar, [this.posVar, this.velVar]);
    Object.assign(this.posVar.material.uniforms, {
      uDt: { value: 0 }, uTime: { value: 0 }, uNozulPos: { value: nozul.clone() },
      uNozulYon: { value: _eksen.clone() }, uDiskR: { value: diskR }
    });
    Object.assign(this.velVar.material.uniforms, {
      uDt: { value: 0 }, uTime: { value: 0 }, uNozulYon: { value: _eksen.clone() },
      uKoniAci: { value: koniAci }, uHizA: { value: p.speed.a }, uHizB: { value: p.speed.b },
      uOmurA: { value: p.life.a }, uOmurB: { value: p.life.b }, uHizScale: { value: 1.0 }
    });
    const hata = this.gpu.init();
    if (hata) console.error('GPUComputationRenderer:', hata);
    const aRef = new Float32Array(this.sayi * 2);
    const aSize = new Float32Array(this.sayi);
    for (let i = 0; i < this.sayi; i++) {
      aRef[i * 2] = ((i % W) + 0.5) / W;
      aRef[i * 2 + 1] = (Math.floor(i / W) + 0.5) / H;
      aSize[i] = p.size * (0.7 + Math.random() * 0.6);
    }
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.sayi * 3), 3));
    this.geo.setAttribute('aRef', new THREE.BufferAttribute(aRef, 2));
    this.geo.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));
    this.mat = new THREE.ShaderMaterial({
      uniforms: katmanUniformlari({
        uPosTex: { value: null }, uVelTex: { value: null }, uDoku: { value: damlaDoku },
        uRenk: { value: new THREE.Color(p.color) }, uAlfa: { value: p.alpha },
        uAeration: { value: p.aeration }, uYumusaklik: { value: preset.yumusaklik }
      }),
      vertexShader: renderVertex, fragmentShader: renderFragment,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    this.points = new THREE.Points(this.geo, this.mat);
    this.points.frustumCulled = false;
    scene.add(this.points);
  }
  setMaster(v) { this.mat.uniforms.uAlfa.value = this.baseAlfa * Math.max(0, v); }
  setHiz(k) { this.velVar.material.uniforms.uHizScale.value = Math.max(0, k); }
  step(dt, t) {
    for (const v of [this.posVar, this.velVar]) {
      v.material.uniforms.uDt.value = dt;
      v.material.uniforms.uTime.value = t;
    }
    this.gpu.compute();
    this.mat.uniforms.uPosTex.value = this.gpu.getCurrentRenderTarget(this.posVar).texture;
    this.mat.uniforms.uVelTex.value = this.gpu.getCurrentRenderTarget(this.velVar).texture;
  }
}

// ============================================================
// BLOK 6 — RENDER SHADER'LARI (Ders 8)
// ============================================================
const renderVertex = /* glsl */`
  attribute vec2  aRef;
  attribute float aSize;
  uniform sampler2D uPosTex;
  uniform sampler2D uVelTex;
  uniform float uPixelYariCap;
  uniform int   uIsikSayisi;
  uniform vec3  uIsikPos[4];
  uniform vec3  uIsikYon[4];
  uniform float uIsikCosAci[4];
  uniform vec3  uIsikRenk[4];
  varying float vVy;
  varying float vAge;
  varying float vViewZ;
  varying vec3  vIsik;
  void main() {
    vec4 P = texture2D(uPosTex, aRef);
    vec4 V = texture2D(uVelTex, aRef);
    vec3 worldPos = P.xyz;
    vVy  = V.y;
    vAge = clamp(P.w / max(V.w, 1e-4), 0.0, 1.0);
    vIsik = vec3(0.0);
    for (int i = 0; i < 4; i++) {
      if (i >= uIsikSayisi) break;
      vec3 d = worldPos - uIsikPos[i];
      float dist = length(d);
      vec3 L = d / max(dist, 1e-4);
      float inCone = smoothstep(uIsikCosAci[i] - 0.05, uIsikCosAci[i], dot(L, uIsikYon[i]));
      float att = 1.0 / (1.0 + 0.12 * dist * dist);
      vIsik += uIsikRenk[i] * inCone * att;
    }
    float m = max(vIsik.r, max(vIsik.g, vIsik.b));
    if (m > 1.0) vIsik /= m;
    vec4 mvPosition = viewMatrix * vec4(worldPos, 1.0);
    vViewZ = mvPosition.z;
    gl_PointSize = aSize * (uPixelYariCap / -mvPosition.z);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const renderFragment = /* glsl */`
  uniform sampler2D uDoku;
  uniform vec3  uRenk;
  uniform float uAlfa;
  uniform float uAeration;
  uniform float uIsikTepki;
  uniform float uTabanIsik;
  varying float vVy;
  varying float vAge;
  varying float vViewZ;
  varying vec3  vIsik;
  ${SOFT_FADE_GLSL}
  void main() {
    float doku = texture2D(uDoku, gl_PointCoord).a;
    if (doku < 0.01) discard;
    float hizKopuk = 1.0 - smoothstep(0.5, 3.0, abs(vVy));
    float kopuk = max(uAeration, hizKopuk);
    vec3 albedo = mix(uRenk, vec3(1.0), kopuk * 0.9);
    vec3 renk = albedo * (uTabanIsik + vIsik * uIsikTepki);
    float alfa = uAlfa * doku * mix(1.0, 1.8, kopuk);
    alfa *= 1.0 - smoothstep(0.75, 1.0, vAge);
    alfa *= softFade(vViewZ);
    gl_FragColor = vec4(renk, alfa);
  }
`;

    hueBasla: 0.33, hizHue: 0.018, doygunluk: 0.9, parlaklik: 0.50 }
};

class IsikSistemi {
  constructor(preset, index) {
    this.preset = preset; this.index = index;
    this.pos = new THREE.Vector3().fromArray(preset.konum);
    this.hedef = new THREE.Vector3().fromArray(preset.hedef);
    this.aciRad = THREE.MathUtils.degToRad(preset.aciDeg);
    this.renk = new THREE.Color(); this._bridge = new THREE.Color();
    this.yon = new THREE.Vector3().subVectors(this.hedef, this.pos).normalize();
    this.cosAci = Math.cos(this.aciRad);
    this.hueOverride = null; this.parlaklikScale = 1.0;
    this.spot = new THREE.SpotLight(0xffffff, preset.spotSiddet, preset.menzil, this.aciRad, 0.6, 1.2);
    this.spot.position.copy(this.pos);
    this.spot.target.position.copy(this.hedef);
    scene.add(this.spot);
    scene.add(this.spot.target);
  }
  setHue(h) { this.hueOverride = ((h % 1) + 1) % 1; }
  setParlaklik(b) { this.parlaklikScale = Math.max(0, b); }
  guncelle(t) {
    const pr = this.preset;
    let hue;
    if (this.hueOverride !== null) hue = this.hueOverride;
    else { hue = (pr.hueBasla + t * pr.hizHue) % 1.0; if (hue < 0) hue += 1.0; }
    this.renk.setHSL(hue, pr.doygunluk, pr.parlaklik);
    const b = this.parlaklikScale;
    this.spot.color.copy(this.renk);
    this.spot.intensity = pr.spotSiddet * b;
    this._bridge.copy(this.renk).multiplyScalar(b);
    ortakUniformlar.uIsikPos.value[this.index].copy(this.pos);
    ortakUniformlar.uIsikYon.value[this.index].copy(this.yon);
    ortakUniformlar.uIsikCosAci.value[this.index] = this.cosAci;
    ortakUniformlar.uIsikRenk.value[this.index].copy(this._bridge);
  }
}

const ZAMAN_CIZELGESI = { sure: 16, kanallar: [] };

class Zamanlayici {
  constructor(cizelge, kayit) { this.cizelge = cizelge; this.kayit = kayit; }
  ornekle(kanal, t) {
    const a = kanal.anahtarlar;
    if (!a.length) return 0;
    if (t <= a[0][0]) return a[0][1];
    const son = a[a.length - 1];
    if (t >= son[0]) return son[1];
    for (let i = 0; i < a.length - 1; i++) {
      const [t0, v0] = a[i], [t1, v1] = a[i + 1];
      if (t >= t0 && t <= t1) {
        if (kanal.tip === 'step') return v0;
        let u = (t - t0) / (t1 - t0);
        if (kanal.tip === 'smooth') u = u * u * (3 - 2 * u);
        return v0 + (v1 - v0) * u;
      }
    }
    return son[1];
  }
  uygula(t) {
    for (const kanal of this.cizelge.kanallar) {
      const fn = this.kayit[kanal.hedef];
      if (fn) fn(this.ornekle(kanal, t));
    }
  }
}

// BLOK 10 — EDİTÖR TRANSPORT (Ders 8, Web Audio'ya taşındı)
// Ses artık AudioBuffer (analiz PCM ister) + BufferSource ile çalar.
// Otorite: AudioContext çalışıyorsa audio saati, değilse iç saat.
// ============================================================
const AC = window.AudioContext || window.webkitAudioContext;
const actx = new AC();
// Kayıt için ses akış hedefi: buffer kaynakları hem hoparlöre (destination)
// hem buraya bağlanır → MediaRecorder ses track'ini buradan alır (BLOK 14).
const sesHedef = actx.createMediaStreamDestination();
const oynatBtn = document.getElementById('oynat');

const transport = {
  showT: 0, sure: ZAMAN_CIZELGESI.sure, oynuyor: false, dongu: true,
  buffer: null, src: null, t0: 0,
  sesAktif() { return this.buffer && actx.state === 'running'; },
  tik(dt) {
    if (this.sesAktif() && this.oynuyor) {
      let t = actx.currentTime - this.t0;
      if (t >= this.sure) {
        if (this.dongu) { this.baslatKaynak(0); t = 0; } else { this.oynat(false); t = this.sure; }
      }
      this.showT = t;
    } else if (this.oynuyor) {
      this.showT += dt;
      if (this.showT >= this.sure) { this.showT = this.dongu ? this.showT % this.sure : this.sure; if (!this.dongu) this.oynat(false); }
    }
    return this.showT;
  },
  baslatKaynak(offset) {
    if (this.src) { try { this.src.stop(); } catch (e) {} this.src.disconnect(); this.src = null; }
    if (!this.buffer) return;
    const s = actx.createBufferSource();
    s.buffer = this.buffer;
    s.connect(actx.destination);   // hoparlör
    s.connect(sesHedef);           // kayıt akışı (BLOK 14)
    s.start(0, Math.max(0, offset % this.buffer.duration));
    this.src = s;
    this.t0 = actx.currentTime - offset;
  },
  oynat(ac = true) {
    this.oynuyor = ac;
    if (this.buffer) {
      if (ac) { actx.resume().then(() => this.baslatKaynak(this.showT)); }
      else if (this.src) { try { this.src.stop(); } catch (e) {} this.src = null; }
    }
    oynatBtn.textContent = ac ? '⏸' : '▶';
  },
  scrubla(t) {
    this.showT = Math.max(0, Math.min(this.sure, t));
    if (this.sesAktif() && this.oynuyor) this.baslatKaynak(this.showT);
  }
};

function mesajGoster(m) {
  const el = document.getElementById('mesaj');
  el.textContent = m; el.style.opacity = '1';
  clearTimeout(mesajGoster._t);
  mesajGoster._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

oynatBtn.onclick = () => transport.oynat(!transport.oynuyor);
document.getElementById('dongu').onclick = (e) => {
  transport.dongu = !transport.dongu;
  e.target.textContent = '⟳ döngü: ' + (transport.dongu ? 'açık' : 'kapalı');

// BLOK 11 — EDİTÖR TUVALİ (Ders 8, birebir)
// ============================================================
function kanalAralik(hedef) {
  if (hedef.endsWith('.hue')) return [0, 1];
  if (hedef.endsWith('.master')) return [0, 1];
  if (hedef.endsWith('.parlaklik')) return [0, 1.5];
  if (hedef.endsWith('.hiz')) return [0, 1.4];
  return [0, 1];
}
const tuval = document.getElementById('tuval');
const g2 = tuval.getContext('2d');
const GUTTER = 138, RULER = 18, KEN_R = 5;
let layout = null;
function tuvalOlcekle() {
  const w = tuval.clientWidth, h = tuval.clientHeight;
  const dpr = Math.min(devicePixelRatio, 2);
  tuval.width = w * dpr; tuval.height = h * dpr;
  g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout = kurLayout(w, h);
}
function kurLayout(w, h) {
  const x0 = GUTTER, x1 = w - 12, W = x1 - x0;
  const n = Math.max(1, ZAMAN_CIZELGESI.kanallar.length);
  const laneH = (h - RULER) / n;
  const lanes = ZAMAN_CIZELGESI.kanallar.map((kanal, i) => {
    const [min, max] = kanalAralik(kanal.hedef);
    return { kanal, i, yTop: RULER + i * laneH, laneH, min, max, renk: `hsl(${(i * 47) % 360} 70% 62%)` };
  });
  return { x0, x1, W, RULER, laneH, lanes, w, h };
}
const tX = (t) => layout.x0 + (t / transport.sure) * layout.W;
const xT = (px) => ((px - layout.x0) / layout.W) * transport.sure;
const vY = (lane, v) => lane.yTop + (1 - (v - lane.min) / (lane.max - lane.min)) * lane.laneH;
const yV = (lane, py) => lane.min + (1 - (py - lane.yTop) / lane.laneH) * (lane.max - lane.min);

function ciz() {
  if (!layout) return;
  const { w, h, lanes } = layout;
  g2.clearRect(0, 0, w, h);
  g2.fillStyle = '#0c1420'; g2.fillRect(0, 0, w, layout.RULER);
  g2.strokeStyle = '#1a2a3a'; g2.fillStyle = '#5f7d96';
  g2.font = '10px Consolas'; g2.textBaseline = 'middle';
  const adim = transport.sure > 40 ? 5 : transport.sure > 16 ? 2 : 1;
  for (let s = 0; s <= transport.sure + 0.01; s += adim) {
    const x = tX(s);
    g2.beginPath(); g2.moveTo(x, 0); g2.lineTo(x, h); g2.globalAlpha = 0.25; g2.stroke(); g2.globalAlpha = 1;
    g2.fillText(s.toFixed(0) + 's', x + 2, layout.RULER / 2);
  }
  for (const lane of lanes) {
    g2.fillStyle = lane.i % 2 ? 'rgba(255,255,255,0.02)' : 'rgba(255,255,255,0.045)';
    g2.fillRect(0, lane.yTop, w, lane.laneH);
    g2.fillStyle = '#0a121c'; g2.fillRect(0, lane.yTop, GUTTER - 2, lane.laneH);
    g2.fillStyle = lane.renk; g2.font = '11px Consolas'; g2.textBaseline = 'middle';
    g2.fillText(lane.kanal.hedef, 8, lane.yTop + lane.laneH / 2);
    g2.fillStyle = '#3a5068'; g2.font = '9px Consolas';
    g2.fillText(lane.kanal.tip, GUTTER - 42, lane.yTop + 8);
    const a = lane.kanal.anahtarlar;
    if (a.length) {
      g2.strokeStyle = lane.renk; g2.lineWidth = 1.5; g2.globalAlpha = 0.9;
      g2.beginPath();
      const N = Math.max(2, Math.round(layout.W / 3));
      for (let s = 0; s <= N; s++) {
        const t = (s / N) * transport.sure;
        const v = zamanlayici.ornekle(lane.kanal, t);
        const x = tX(t), y = vY(lane, v);
        s === 0 ? g2.moveTo(x, y) : g2.lineTo(x, y);
      }
      g2.stroke(); g2.globalAlpha = 1; g2.lineWidth = 1;
      for (const [t, v] of a) {
        g2.fillStyle = lane.renk;
        g2.beginPath(); g2.arc(tX(t), vY(lane, v), KEN_R, 0, 7); g2.fill();
        g2.strokeStyle = '#0a121c'; g2.stroke();
      }
    }
  }
  const px = tX(transport.showT);
  g2.strokeStyle = '#ffd27f'; g2.lineWidth = 1.5;
  g2.beginPath(); g2.moveTo(px, 0); g2.lineTo(px, h); g2.stroke(); g2.lineWidth = 1;
  g2.fillStyle = '#ffd27f';
  g2.beginPath(); g2.moveTo(px - 5, 0); g2.lineTo(px + 5, 0); g2.lineTo(px, 7); g2.fill();
}

let suru = null;
function fareYer(e) { const r = tuval.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function laneBul(py) { return layout.lanes.find(l => py >= l.yTop && py < l.yTop + l.laneH); }
function cueBul(px, py) {
  for (const lane of layout.lanes) {
    const a = lane.kanal.anahtarlar;
    for (let i = 0; i < a.length; i++) {
      const dx = tX(a[i][0]) - px, dy = vY(lane, a[i][1]) - py;
      if (dx * dx + dy * dy <= (KEN_R + 3) * (KEN_R + 3)) return { lane, idx: i };
    }
  }
  return null;
}
tuval.addEventListener('pointerdown', (e) => {
  const { x, y } = fareYer(e);
  if (y < layout.RULER) { transport.oynat(false); transport.scrubla(xT(x)); suru = { scrub: true }; tuval.setPointerCapture(e.pointerId); return; }
  const hit = cueBul(x, y);
  if (hit) { suru = hit; tuval.setPointerCapture(e.pointerId); return; }
  const lane = laneBul(y);
  if (lane && x > layout.x0) {
    const t = Math.max(0, Math.min(transport.sure, xT(x)));
    const v = Math.max(lane.min, Math.min(lane.max, yV(lane, y)));
    lane.kanal.anahtarlar.push([t, v]);
    lane.kanal.anahtarlar.sort((p, q) => p[0] - q[0]);
    suru = { lane, idx: lane.kanal.anahtarlar.findIndex(k => k[0] === t && k[1] === v) };
    tuval.setPointerCapture(e.pointerId);
  }
});
tuval.addEventListener('pointermove', (e) => {
  if (!suru) return;
  const { x, y } = fareYer(e);
  if (suru.scrub) { transport.scrubla(xT(x)); return; }
  const { lane } = suru;
  const a = lane.kanal.anahtarlar;
  const prev = suru.idx > 0 ? a[suru.idx - 1][0] + 0.01 : 0;
  const next = suru.idx < a.length - 1 ? a[suru.idx + 1][0] - 0.01 : transport.sure;
  a[suru.idx][0] = Math.max(prev, Math.min(next, xT(x)));
  a[suru.idx][1] = Math.max(lane.min, Math.min(lane.max, yV(lane, y)));
});
tuval.addEventListener('pointerup', () => { suru = null; });
function cueSil(x, y) {
  const hit = cueBul(x, y);
  if (hit && hit.lane.kanal.anahtarlar.length > 1) { hit.lane.kanal.anahtarlar.splice(hit.idx, 1); mesajGoster('cue silindi: ' + hit.lane.kanal.hedef); }
}
tuval.addEventListener('dblclick', (e) => { const p = fareYer(e); cueSil(p.x, p.y); });
tuval.addEventListener('contextmenu', (e) => { e.preventDefault(); const p = fareYer(e); cueSil(p.x, p.y); });

// ============================================================
// BLOK 12 — ⭐ BESTECİ: MÜZİK → TIMELINE
// ============================================================

// --- 12a. ANALİZ: PCM → enerji zarfı + beat (onset) + drop ---
function analizEt(buf) {
  const sr = buf.sampleRate;
  const ch0 = buf.getChannelData(0);
  const ch1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
  const N = ch0.length;
  const hop = 1024;                       // ~23ms çerçeve @44.1k
  const dt = hop / sr;
  const F = Math.floor(N / hop);
  // çerçeve enerjisi (RMS)
  const enerji = new Float32Array(F);
  for (let f = 0; f < F; f++) {
    let s = 0; const b = f * hop;
    for (let i = 0; i < hop; i++) { const x = ch1 ? 0.5 * (ch0[b + i] + ch1[b + i]) : ch0[b + i]; s += x * x; }
    enerji[f] = Math.sqrt(s / hop);
  }
  let emax = 1e-6; for (const e of enerji) if (e > emax) emax = e;
  for (let i = 0; i < F; i++) enerji[i] /= emax;   // 0..1 normalize
  // yumuşatılmış zarf (hareketli ortalama ~0.18s) → seviye/master için
  const zarf = new Float32Array(F);
  const win = Math.max(1, Math.round(0.18 / dt));
  let acc = 0;
  for (let i = 0; i < F; i++) { acc += enerji[i]; if (i >= win) acc -= enerji[i - win]; zarf[i] = acc / Math.min(i + 1, win); }
  // onset akısı (pozitif enerji farkı) → adaptif tepe seçimi = beat
  const fluks = new Float32Array(F);
  for (let i = 1; i < F; i++) fluks[i] = Math.max(0, enerji[i] - enerji[i - 1]);
  const beatler = [];
  const w2 = Math.max(1, Math.round(0.22 / dt));
  let sonBeat = -1;
  for (let i = 1; i < F - 1; i++) {
    let m = 0, c = 0;
    for (let j = Math.max(0, i - w2); j <= Math.min(F - 1, i + w2); j++) { m += fluks[j]; c++; }
    m /= c;
    if (fluks[i] > m * 1.4 && fluks[i] >= fluks[i - 1] && fluks[i] > fluks[i + 1] && fluks[i] > 0.02) {
      const t = i * dt;
      if (sonBeat < 0 || t - sonBeat > 0.14) { beatler.push(t); sonBeat = t; }
    }
  }
  // drop: zarf <0.4 iken >0.72'yi geçiş
  const droplar = [];
  let arm = true;
  for (let i = 0; i < F; i++) {
    if (arm && zarf[i] > 0.72) { droplar.push(i * dt); arm = false; }
    if (zarf[i] < 0.4) arm = true;
  }
  return { sure: buf.duration, dt, enerji, zarf, beatler, droplar };
}

// zamanları kesin ARTAN yap (eşit/çakışan zaman ornekle'yi bozar)
function artan(arr) {
  arr.sort((p, q) => p[0] - q[0]);
  const out = []; let son = -1;
  for (let [t, v] of arr) { if (t <= son) t = son + 0.001; out.push([+t.toFixed(3), +v.toFixed(3)]); son = t; }
  return out;
}

// --- 12c. TIMELINE ÜRETEÇ: analiz → kanallar (DESEN KÜTÜPHANESİ) ---
function timelineUret(a) {
  const sure = a.sure, dt = a.dt, zarf = a.zarf;
  const zAt = (t) => zarf[Math.max(0, Math.min(zarf.length - 1, Math.round(t / dt)))];
  // 0.5s örnekli zarf (master/parlaklik/geyser.hiz için)
  const orn = [];
  for (let t = 0; t <= sure + 1e-3; t += 0.5) orn.push([Math.min(t, sure), zAt(t)]);

  // desen: jet master = enerji zarfı (0.25..1.0)
  const jetMaster = artan(orn.map(([t, e]) => [t, 0.25 + 0.75 * e]));
  // desen: geyser step — enerji > 0.55 iken açık (min 0.25s toggle)
  const gk = [[0, 0]]; let durum = 0;
  for (let t = 0; t <= sure; t += 0.25) { const on = zAt(t) > 0.55 ? 1 : 0; if (on !== durum) { gk.push([+t.toFixed(2), on]); durum = on; } }
  gk.push([sure, 0]);
  // desen: geyser hız = 0.9..1.4 enerjiyle
  const gh = artan(orn.map(([t, e]) => [t, 0.9 + 0.5 * e]));

  // desen: jet hız = 0.7 taban + her beat'te nabız (beat sayısı <=56'ya inceltilir)
  let bts = a.beatler.filter(t => t > 0.1 && t < sure - 0.1);
  if (bts.length > 56) { const st = Math.ceil(bts.length / 56); bts = bts.filter((_, i) => i % st === 0); }
  const hk = [[0, 0.7]];
  for (const t of bts) hk.push([t - 0.05, 0.75], [t, 1.3], [t + 0.12, 0.8]);
  hk.push([sure, 0.7]);

  // desen: ışık hue = her drop'ta +0.28 basamak (üç ışık farklı ofset)
  function hueKanal(hedef, off) {
    let h = off % 1; const k = [[0, h]];
    for (const dtp of a.droplar) { h = (h + 0.28) % 1; k.push([+dtp.toFixed(2), h]); }
    k.push([sure, h]);
    return { hedef, tip: 'step', anahtarlar: artan(k) };
  }
  // desen: ışık parlaklık = enerji + drop'ta patlama
  function parlakKanal(hedef) {
    const k = orn.map(([t, e]) => [t, 0.4 + 0.7 * e]);
    for (const dtp of a.droplar) k.push([dtp - 0.05, 0.5], [dtp, 1.4], [dtp + 0.4, 0.9]);
    return { hedef, tip: 'smooth', anahtarlar: artan(k) };
  }

  return {
    sure, kanallar: [
      { hedef: 'duz_jet.master', tip: 'smooth', anahtarlar: jetMaster },
      { hedef: 'duz_jet.hiz', tip: 'smooth', anahtarlar: artan(hk) },
      { hedef: 'geyser.master', tip: 'step', anahtarlar: artan(gk) },
      { hedef: 'geyser.hiz', tip: 'smooth', anahtarlar: gh },
      hueKanal('spot_kirmizi.hue', 0.0), parlakKanal('spot_kirmizi.parlaklik'),
      hueKanal('spot_mavi.hue', 0.4), parlakKanal('spot_mavi.parlaklik'),
      hueKanal('spot_yesil.hue', 0.7), parlakKanal('spot_yesil.parlaklik')
    ]
  };
}

// --- 12b. SENTETİK ÜRETEÇ: prosedürel parça (kick + build + drop) ---
function sentetikUret(saniye = 16, bpm = 120) {
  const sr = 44100, Nn = Math.floor(saniye * sr);
  const buf = actx.createBuffer(1, Nn, sr);
  const d = buf.getChannelData(0);
  const beatAralik = 60 / bpm;
  const seviye = (t) => {
    if (t < 4) return 0.22;                       // giriş
    if (t < 8) return 0.22 + (t - 4) / 4 * 0.6;   // build
    if (t < 14) return 0.92;                      // drop + sürdür
    return Math.max(0, 0.92 - (t - 14) / 2 * 0.92); // outro
  };
  for (let i = 0; i < Nn; i++) {
    const t = i / sr;
    const lv = seviye(t);
    const ph = t % beatAralik;
    let kick = 0;
    if (ph < 0.12) { const env = Math.exp(-ph * 42); kick = Math.sin(2 * Math.PI * 58 * ph) * env; }
    let hat = 0;
    if (lv > 0.45) { const hp = (t + beatAralik / 2) % beatAralik; if (hp < 0.02) hat = (Math.random() * 2 - 1) * Math.exp(-hp * 400) * 0.35; }
    const pad = 0.07 * Math.sin(2 * Math.PI * 165 * t) * lv;
    d[i] = (kick * 0.95 + hat + pad) * (0.3 + 0.7 * lv);
  }
  return buf;
}

// --- 12d. PİPELİNE: buffer → analiz → üret → yükle → çal ---
function timelineYukle(yeni) {
  ZAMAN_CIZELGESI.sure = yeni.sure;
  ZAMAN_CIZELGESI.kanallar = yeni.kanallar;
  transport.sure = yeni.sure;
  transport.showT = 0;
  layout = kurLayout(tuval.clientWidth, tuval.clientHeight);
}
function muzikIsle(buf, ad) {
  transport.buffer = buf;
  const a = analizEt(buf);
  const yeni = timelineUret(a);
  timelineYukle(yeni);
  transport.oynat(true);   // ses askıda olsa da görüntü iç saatle akar
  const anahtarSay = yeni.kanallar.reduce((s, k) => s + k.anahtarlar.length, 0);
  mesajGoster(`${ad}: ${a.sure.toFixed(1)}s · ${a.beatler.length} beat · ${a.droplar.length} drop → ${anahtarSay} anahtar üretildi`);
}
document.getElementById('besteci').onclick = () => muzikIsle(sentetikUret(16, 120), 'sentetik demo');
document.getElementById('muzikDosya').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  mesajGoster('çözülüyor: ' + f.name + ' …');
  try {
    const ab = await f.arrayBuffer();
    const buf = await actx.decodeAudioData(ab);
    muzikIsle(buf, f.name);
  } catch (err) { mesajGoster('çözülemedi: ' + err.message); }
};

// ============================================================
// BLOK 14 — ⭐ VIDEO KAYIT (MediaRecorder + kompozit overlay)
// ============================================================
const kayitTuval = document.createElement('canvas');   // WebGL karesi + marka burada birleşir
const kctx = kayitTuval.getContext('2d');
let kaydediyor = false, recorder = null, kayitBitTimer = null;

// Her kayıt karesinde: WebGL canvas'ını kopyala + Aquatronic overlay çiz.
function kayitKaresiCiz() {
  const c = renderer.domElement;
  if (kayitTuval.width !== c.width || kayitTuval.height !== c.height) {
    kayitTuval.width = c.width; kayitTuval.height = c.height;
  }
  const W = kayitTuval.width, H = kayitTuval.height;
  kctx.drawImage(c, 0, 0, W, H);                       // sahne (preserveDrawingBuffer sayesinde dolu)
  // marka overlay (clean-room: jenerik, müşteri/proje adı YOK)
  const s = Math.round(H * 0.026);
  kctx.font = `600 ${s}px Consolas, monospace`;
  kctx.textBaseline = 'top';
  kctx.fillStyle = 'rgba(255,255,255,0.9)';
  kctx.fillText('AQUATRONIC', s, s);
  kctx.font = `${Math.round(s * 0.7)}px Consolas, monospace`;
  kctx.fillStyle = 'rgba(143,211,255,0.75)';
  kctx.fillText('Show Studio — çeşme şovu önizlemesi', s, s * 2.1);
  // alt bilgi + şov saati
  kctx.textBaseline = 'bottom';
  kctx.fillStyle = 'rgba(143,211,255,0.6)';
  kctx.fillText(`${transport.showT.toFixed(1)} / ${transport.sure.toFixed(1)} s`, s, H - s);
}

function kayitBaslat() {
  if (kaydediyor) { kayitDurdur(); return; }
  if (!('MediaRecorder' in window)) { mesajGoster('bu tarayıcı MediaRecorder desteklemiyor'); return; }
  // ilk kompozit kareyi hazırla (captureStream boyutu doğru okusun)
  kayitKaresiCiz();
  const vstream = kayitTuval.captureStream(30);         // 30 fps video
  const parcalar = [...vstream.getVideoTracks()];
  if (transport.buffer) { actx.resume(); parcalar.push(...sesHedef.stream.getAudioTracks()); }  // ses varsa ekle
  const stream = new MediaStream(parcalar);

  const tipler = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = tipler.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8e6 });
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'aquatronic-show.webm';
    a.click();                                          // kullanıcının kendi tıkının sonucu = indir
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    mesajGoster(`video hazır (${(blob.size / 1e6).toFixed(1)} MB) — indiriliyor`);
  };

  // şovu baştan, tek tur, döngüsüz oynat → kaydı bir tam şovla sınırla
  transport.dongu = false;
  document.getElementById('dongu').textContent = '⟳ döngü: kapalı';
  transport.scrubla(0);
  transport.oynat(true);
  recorder.start(200);
  kaydediyor = true;
  const btn = document.getElementById('kayit');
  btn.classList.add('kaydediyor'); btn.textContent = '⏹ durdur';
  mesajGoster(`kayıt başladı (${mime.split(';')[0]}, ${transport.sure.toFixed(0)}s)…`);
  // bir tam şov + küçük pay sonra otomatik dur
  kayitBitTimer = setTimeout(kayitDurdur, transport.sure * 1000 + 300);
}

function kayitDurdur() {
  if (!kaydediyor) return;
  clearTimeout(kayitBitTimer);
  kaydediyor = false;
  try { recorder.stop(); } catch (e) {}
  const btn = document.getElementById('kayit');
  btn.classList.remove('kaydediyor'); btn.textContent = '🔴 video kaydet';
}
document.getElementById('kayit').onclick = kayitBaslat;
// Debug/önizleme kancası: URL'e #kayit → sayfa açılınca kaydı otomatik başlat
// (gerçek tarayıcıda tek-tık kaydı denemek + otomatik testte kayıt yolunu doğrulamak için).
if (location.hash.includes('kayit')) setTimeout(kayitBaslat, 500);

// ============================================================
// BLOK 13 — DÖNGÜ (Ders 8 + kayıt kompoziti)
// ============================================================
const clock = new THREE.Clock();
let frames = 0, fpsTimer = 0;
const fpsEl = document.getElementById('fps');
const saatEl = document.getElementById('saat');

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  const showT = transport.tik(dt);
  const dtFizik = transport.oynuyor ? dt : 0;
  zamanlayici.uygula(showT);
  for (const l of Object.values(isiklar)) l.guncelle(showT);
  for (const c of Object.values(cihazlar)) c.step(dtFizik, showT);
  controls.update();
  derinlikOnGecisi();
  composer.render();
  if (kaydediyor) kayitKaresiCiz();   // WebGL karesi + marka → kayıt tuvaline (captureStream okur)
  ciz();
  saatEl.textContent = showT.toFixed(1) + ' / ' + transport.sure.toFixed(1) + ' s';
  frames++; fpsTimer += dt;
  if (fpsTimer >= 1) { fpsEl.textContent = frames; frames = 0; fpsTimer = 0; }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  cozunurlukGuncelle();
  tuvalOlcekle();
});
tuvalOlcekle();

// Açılışta besteciyi otomatik çalıştır: sentetik parça → analiz → timeline → çal.
// (Ders kendi kendini gösterir; kullanıcı 🎵 ile kendi parçasını yükleyebilir.)
muzikIsle(sentetikUret(16, 120), 'sentetik demo');

window.DERS10 = { cihazlar, isiklar, ZAMAN_CIZELGESI, zamanlayici, kayit, transport,
  analizEt, timelineUret, sentetikUret, muzikIsle, kayitBaslat, kayitDurdur, ortakUniformlar };
</script>
